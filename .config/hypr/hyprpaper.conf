# ~/.config/hypr/hyprpaper.conf

# Import source from wallust
source = ~/.cache/wallust/colors-hyprland

# Laptop Monitor
wallpaper {
    monitor = eDP-1
    path = $wallpaper
    fit_mode = cover
}

# Fallback Monitor
wallpaper {
    monitor = 
    path = $wallpaper
    fit_mode = cover
}

splash = false
ipc = on
