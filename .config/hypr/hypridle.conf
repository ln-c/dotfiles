source /home/$USER/.cache/wallust/colors-hyprland

general {
    lock_cmd = pidof hyprlock || hyprlock
    unlock_cmd = hyprctl dispatch dpms on
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
    ignore_dbus_inhibit = /opt/spotify/spotify
}

listener {
    timeout = 100
    on-timeout = hyprdvd -s
}
listener {
    timeout = 800
    on-timeout = source /home/$USER/.cache/wallust/colors.sh && notify-send "System" "You are about to be locked out!" -i $wallpaper
}
listener {
    timeout = 1000
    on-timeout = loginctl lock-session
    on-resume = hyprctl dispatch dpms on
}

listener {
    timeout = 2400
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

